[project]
name = "multi-agent-platform"
version = "0.1.0"
description = "Multi-Agent AI Workflow Platform with planner/worker agents, tracing, and memory"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "langchain>=1.3.0,<2.0.0",
    "langchain-openai>=1.5.0,<2.0.0",
    "langchain-anthropic>=1.5.0,<2.0.0",
    "langchain-community>=0.4.0,<0.5.0",
    "tavily-python>=0.5.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
